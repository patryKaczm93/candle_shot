<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Pachnie miło, telefon, koszyk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,700..900,100,1&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFFDF7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a{color:#63391C}
.pm{--eo:cubic-bezier(0.22,1,0.36,1);--ex:cubic-bezier(0.16,1,0.3,1);--drawer:cubic-bezier(0.32,0.72,0,1)}
.disp{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:900;letter-spacing:-0.02em}
.wm{font-family:Fraunces,Georgia,serif;font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;line-height:0.92;letter-spacing:-0.01em;color:#E29D62;-webkit-text-stroke:0.146em #63391C;paint-order:stroke fill;white-space:nowrap}
.lflame{transform-box:fill-box;transform-origin:50% 100%}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){.home:hover .lflame{animation:lflick 1.1s ease-in-out infinite}}
@keyframes lflick{0%,100%{transform:none}35%{transform:scale(0.93,1.08) skewX(-3deg)}70%{transform:scale(1.04,0.96) skewX(2deg)}}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:999px;border:2px solid #63391C;font:800 17px/1 Nunito,sans-serif;text-decoration:none;cursor:pointer;touch-action:manipulation;user-select:none;transition:transform 120ms var(--eo),box-shadow 120ms var(--eo)}
.btn-main{background:#E29D62;color:#4A2A12;box-shadow:3px 3px 0 #63391C}
.btn:active{transform:translate(3px,3px) scale(0.97);box-shadow:0 0 0 #63391C}
.step{width:40px;height:40px;border:none;background:transparent;font:800 18px Nunito,sans-serif;color:#63391C;cursor:pointer;border-radius:50%;touch-action:manipulation;transition:transform 120ms var(--eo)}
.step:active{transform:scale(0.86)}
.step[disabled]{opacity:0.35}
.link-btn{background:none;border:none;padding:10px 0;font:700 15px Nunito,sans-serif;color:#63391C;text-decoration:underline;text-underline-offset:3px;cursor:pointer;touch-action:manipulation}
.bar{height:100%;width:100%;transform-origin:left;transition:transform 520ms var(--ex),background-color 300ms ease}
:focus-visible{outline:3px solid #63391C;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
.sheet{animation:up 480ms var(--drawer) both}
.dim{animation:fade 320ms ease both}
.item{animation:itemIn 420ms var(--ex) both;animation-delay:calc(280ms + var(--i) * 70ms)}
.item.out{animation:itemOut 200ms cubic-bezier(0.55,0.055,0.675,0.19) both}
.roll{display:inline-block;animation:var(--an) 260ms var(--eo) both}
.swap{animation:var(--an) 320ms var(--eo) both}
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes itemIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes itemOut{to{opacity:0;transform:translateX(30px)}}
@keyframes rollA{from{opacity:0;transform:translateY(-60%)}to{opacity:1;transform:none}}
@keyframes rollB{from{opacity:0;transform:translateY(-60%)}to{opacity:1;transform:none}}
@keyframes swapA{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
@keyframes swapB{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:fade 200ms ease both}.bar,.btn,.step{transition:none}}
</style>
</helmet>
<div class="pm" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFDF7; color: #63391C; font-family: Nunito, system-ui, sans-serif; font-size: 17px; line-height: 1.5">

 158.9 L65.3 158.0 L62.6 157.4 L59.5 156.9 L55.8 156.6 L51.7 156.3 L47.2 156.0 L42.5 155.5 L37.8 155.0 L33.2 154.2 L29.1 153.2 L25.5 151.9 L22.8 150.4 L21.0 148.8 L16.8 81.4 Z"></path><path id="pm-flame" d="M100 20 C114 34 115 48 100 60 C85 48 86 34 100 20Z"></path><g id="pm-pot"><use href="#pm-body" style="fill: var(--body, #F7EAD0); stroke: var(--ink, #63391C)" stroke-width="5.5" stroke-linejoin="round"></use><use href="#pm-rim" style="fill: var(--rim, var(--body, #F7EAD0)); stroke: var(--ink, #63391C)" stroke-width="5.5" stroke-linejoin="round"></use><ellipse cx="100" cy="72" rx="44" ry="18.6" style="fill: var(--wax, #FFFFFF); stroke: var(--ink, #63391C)" stroke-width="5.5"></ellipse><line x1="100" y1="72" x2="100" y2="59" style="stroke: var(--ink, #63391C)" stroke-width="5.5" stroke-linecap="round"></line></g><g id="pm-pot-b"><use href="#pm-body" style="fill: var(--ink, #63391C); stroke: var(--ink, #63391C)" stroke-width="15" stroke-linejoin="round"></use><use href="#pm-rim" style="fill: var(--ink, #63391C); stroke: var(--ink, #63391C)" stroke-width="15" stroke-linejoin="round"></use><use href="#pm-body" style="fill: var(--body, #F7EAD0)"></use><use href="#pm-rim" style="fill: var(--rim, var(--body, #F7EAD0)); stroke: var(--ink, #63391C)" stroke-width="9" stroke-linejoin="round"></use><ellipse cx="100" cy="72" rx="42" ry="17" style="fill: var(--wax, #FFFFFF); stroke: var(--ink, #63391C)" stroke-width="7"></ellipse><line x1="100" y1="72" x2="100" y2="59" style="stroke: var(--ink, #63391C)" stroke-width="7" stroke-linecap="round"></line></g><symbol id="pm-mark" viewBox="0 12 200 168"><use href="#pm-pot"></use><use href="#pm-flame" style="fill: var(--flame, #E29D62); stroke: var(--ink, #63391C)" stroke-width="5.5" stroke-linejoin="round"></use></symbol><symbol id="pm-mark-b" viewBox="0 6 200 174"><use href="#pm-pot-b"></use><use href="#pm-flame" style="fill: var(--flame, #E29D62); stroke: var(--ink, #63391C)" stroke-width="7" stroke-linejoin="round" transform="translate(-14 -14) scale(1.14)"></use></symbol></defs></svg>

<div aria-hidden="true">
<div style="background: #63391C; height: 34px"></div>
<div style="border-bottom: 2px solid #63391C; height: 72px"></div>
<div style="padding: 28px 16px">
<div style="width: 70%; height: 44px; border-radius: 12px; background: #F7EAD0; margin-bottom: 24px"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="height: 250px; border-radius: 18px; background: #F7EAD0"></div>
<div style="height: 250px; border-radius: 18px; background: #F7EAD0"></div>
</div>
</div>
</div>

<a class="dim" href="Tel-Sklep.dc.html" aria-label="Zamknij koszyk" style="position: absolute; inset: 0; background: rgba(74, 42, 18, 0.5)"></a>

<section class="sheet" role="dialog" aria-label="Koszyk" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; background: #FFFDF7; border-top: 2px solid #63391C; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; overflow: hidden">
<div aria-hidden="true" style="display: flex; justify-content: center; padding: 10px 0 2px"><span style="width: 44px; height: 5px; border-radius: 999px; background: #D9C3A0"></span></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 16px 14px">
<h2 class="disp" style="margin: 0; font-size: 28px; line-height: 1">Twój koszyk <span style="font-size: 18px; color: #7D5232; white-space: nowrap">(<span class="roll" style="--an: {{cAnim}}">{{countLabel}}</span>)</span></h2>
<a href="Tel-Sklep.dc.html" aria-label="Zamknij koszyk" style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: 2px solid #63391C; background: #F7EAD0; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#63391C" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="padding: 0 16px 14px">
<p class="swap" style="--an: {{sAnim}}; margin: 0 0 8px; font-size: 14px; font-weight: 800">{{shipMsg}}</p>
<div style="height: 12px; border-radius: 999px; border: 2px solid #63391C; background: #F7EAD0; overflow: hidden"><div class="bar" style="{{barStyle}}"></div></div>
</div>
<div style="flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<div class="{{it.cls}}" style="--i: {{it.i}}; display: flex; gap: 12px; padding: 12px; background: #F7EAD0; border-radius: 16px">
<span style="flex: 0 0 72px; height: 72px; background: #EAD3B2; border: 2px solid #63391C; border-radius: 12px; display: flex; align-items: center; justify-content: center">
<svg width="54" viewBox="0 6 200 192" aria-hidden="true"><use href="#pm-pot-b" style="--body: {{it.gips}}; --rim: {{it.gips}}"></use><path d="M100 20 C114 34 115 48 100 60 C85 48 86 34 100 20Z" fill="#E29D62" stroke="#63391C" stroke-width="7" stroke-linejoin="round"></path></svg>
</span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<span class="disp" style="font-size: 16px; line-height: 1.2; overflow-wrap: anywhere; min-width: 0">{{it.name}}</span>
<span style="font-weight: 800; white-space: nowrap; font-size: 15px; flex-shrink: 0; font-variant-numeric: tabular-nums">{{it.price}}</span>
</div>
<span style="font-size: 14px; color: #7D5232">Gips: {{it.variant}}</span>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 8px">
<div role="group" aria-label="Ilość" style="display: flex; align-items: center; border: 2px solid #63391C; border-radius: 999px; background: #FFFDF7; flex-shrink: 0">
<button class="step" type="button" onClick="{{it.dec}}" disabled="{{it.atMin}}" aria-label="Zmniejsz ilość">−</button>
<span style="min-width: 26px; text-align: center; font-weight: 800; overflow: hidden; font-variant-numeric: tabular-nums" aria-live="polite"><span class="roll" style="--an: {{it.qAnim}}">{{it.qty}}</span></span>
<button class="step" type="button" onClick="{{it.inc}}" disabled="{{it.atMax}}" aria-label="Zwiększ ilość">+</button>
</div>
<button class="link-btn" type="button" onClick="{{it.remove}}">Usuń</button>
</div>
</div>
</div>
</sc-for>
</div>
<div style="border-top: 2px solid #63391C; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 12px"><span>Suma częściowa</span><span style="font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums">{{subtotal}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; color: #7D5232"><span>Dostawa</span><span>w następnym kroku</span></div>
<a class="btn btn-main" href="Tel-Zamowienie.dc.html" style="margin-top: 6px">Przejdź do zamówienia →</a>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div class="item" style="--i: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 24px 40px; text-align: center">
<svg width="96" viewBox="0 6 200 192" aria-hidden="true"><use href="#pm-pot" style="--body: #FFFFFF; --rim: #FFFFFF"></use><path d="M100 55 C95 46 105 41 100 31" fill="none" stroke="#7D5232" stroke-width="3" stroke-linecap="round"></path></svg>
<h3 class="disp" style="margin: 0; font-size: 26px">Tu jeszcze nic nie pachnie</h3>
<p style="margin: 0">Twój koszyk jest pusty.</p>
<a class="btn btn-main" href="Tel-Sklep.dc.html" style="align-self: stretch; margin-top: 6px">Przejdź do sklepu</a>
<button class="link-btn" type="button" onClick="{{reset}}">Przywróć przykładowy koszyk</button>
</div>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dane":{"editor":"enum","options":["Demo","Najgorszy przypadek","Pusty koszyk"],"default":"Demo","section":"Test danych"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentWillUnmount() { clearTimeout(this.t); }
renderVals() {
const mode = this.props.dane ?? 'Demo';
const demo = [
{ id: 'a', name: 'Wanilia i drewno sandałowe', variant: 'naturalny biały', gips: '#FFFFFF', unit: 0, q: 1 },
{ id: 'b', name: 'Figa i bergamotka', variant: 'szałwia', gips: '#B9C2A4', unit: 0, q: 1 }
];
const worst = [
{ id: 'a', name: 'Zestaw prezentowy „Wieczór przy kominku” z trzema świeczkami sojowymi i drewnianymi zapałkami', variant: 'terakota', gips: '#D9A27A', unit: 1249, q: 1 },
{ id: 'b', name: 'Mgła', variant: 'grafit', gips: '#8C8178', unit: 9.99, q: 10 },
{ id: 'c', name: 'Bergamotka-limonka-trawa cytrynowa', variant: 'szałwia', gips: '#B9C2A4', unit: 189, q: 1 },
{ id: 'd', name: 'Wanilia', variant: 'naturalny biały', gips: '#FFFFFF', unit: 39, q: 2 }
];
const key = mode;
const s = (this.state && this.state.key === key) ? this.state : { key };
const base = mode === 'Najgorszy przypadek' ? worst : ((mode === 'Pusty koszyk' && !s.restored) ? [] : demo);
const q = s.q || Object.fromEntries(base.map(b => [b.id, b.q]));
const leaving = s.leaving || {};
const fmt = n => new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' }).format(n);
const setQ = (id, v) => this.setState({ key, q: Object.assign({}, q, { [id]: v }), leaving, flip: (s.flip || 0) + 1, restored: s.restored });
const remove = id => {
this.setState({ key, q, leaving: Object.assign({}, leaving, { [id]: true }), restored: s.restored });
clearTimeout(this.t);
this.t = setTimeout(() => {
const st = this.state || {};
this.setState({ q: Object.assign({}, st.q || q, { [id]: 0 }), leaving: Object.assign({}, st.leaving, { [id]: false }), flip: (st.flip || 0) + 1 });
}, 200);
};
const live = base.filter(b => (q[b.id] || 0) > 0);
const total = live.reduce((n, b) => n + q[b.id], 0);
const sum = live.reduce((n, b) => n + q[b.id] * b.unit, 0);
const priced = mode === 'Najgorszy przypadek';
const pct = Math.min(1, 0.3 + total * 0.2);
const flip = s.flip || 0;
return {
items: live.map((b, i) => ({
i,
cls: leaving[b.id] ? 'item out' : 'item',
name: b.name, variant: b.variant, gips: b.gips, qty: q[b.id],
qAnim: q[b.id] % 2 ? 'rollA' : 'rollB',
atMin: q[b.id] <= 1,
atMax: q[b.id] >= 10,
price: priced ? fmt(q[b.id] * b.unit) : (q[b.id] === 1 ? 'XX zł' : q[b.id] + ' × XX zł'),
inc: () => setQ(b.id, Math.min(q[b.id] + 1, 10)),
dec: () => setQ(b.id, Math.max(q[b.id] - 1, 1)),
remove: () => remove(b.id)
})),
countLabel: total,
cAnim: total % 2 ? 'rollA' : 'rollB',
subtotal: priced ? fmt(sum) : 'XX zł',
hasItems: total > 0,
isEmpty: total === 0,
shipMsg: pct >= 1 ? 'Masz darmową dostawę!' : 'Brakuje [X] zł do darmowej dostawy',
sAnim: pct >= 1 ? 'swapB' : 'swapA',
barStyle: 'transform: scaleX(' + pct + '); background: ' + (pct >= 1 ? '#4F6B2E' : '#E29D62'),
reset: () => this.setState({ key, restored: true, q: Object.fromEntries(demo.map(b => [b.id, b.q])), leaving: {}, flip: flip + 1 })
};
}
}
</script>
</body>
</html>
